      <sc-if value="{{ notSubmitted }}" hint-placeholder-val="{{ true }}">

            <input id="yg-modal-name" type="text" value="{{ name }}" onChange="{{ onName }}" placeholder="Full name" style="width: 100%; padding: 12px 0; font-family: inherit; font-size: 16px; color: #edf2ee; background: transparent; border: 0; border-bottom: 1px solid #3a423d; border-radius: 0;">
            <sc-if value="{{ errName }}" hint-placeholder-val="{{ false }}">
              <div style="font-size: 13px; color: #ff8a6b;">{{ errName }}</div>
            </sc-if>
          </div>
          <div style="display: grid; gap: 8px;">
            <label for="yg-modal-phone" style="font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: #9aa5a0;">WhatsApp number <span style="color: #c6fb3e;">*</span></label>
            <input id="yg-modal-phone" type="tel" value="{{ phone }}" onChange="{{ onPhone }}" placeholder="+91 98765 43210" style="width: 100%; padding: 12px 0; font-family: inherit; font-size: 16px; color: #edf2ee; background: transparent; border: 0; border-bottom: 1px solid #3a423d; border-radius: 0;">
            <sc-if value="{{ errPhone }}" hint-placeholder-val="{{ false }}">
              <div style="font-size: 13px; color: #ff8a6b;">{{ errPhone }}</div>
            </sc-if>
          </div>
          <div style="display: grid; gap: 8px;">
            <label for="yg-modal-email" style="font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: #9aa5a0;">Email <span style="color: #c6fb3e;">*</span></label>
            <input id="yg-modal-email" type="email" value="{{ email }}" onChange="{{ onEmail }}" placeholder="you@email.com" style="width: 100%; padding: 12px 0; font-family: inherit; font-size: 16px; color: #edf2ee; background: transparent; border: 0; border-bottom: 1px solid #3a423d; border-radius: 0;">
            <sc-if value="{{ errEmail }}" hint-placeholder-val="{{ false }}">
              <div style="font-size: 13px; color: #ff8a6b;">{{ errEmail }}</div>
            </sc-if>
          </div>
          <div style="display: grid; gap: 8px;">
            <label for="yg-modal-capital" style="font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: #9aa5a0;">Capital deposited <span style="color: #6c7a72;">(optional)</span></label>
            <div style="display: flex; border-bottom: 1px solid #3a423d;">
              <span style="display: flex; align-items: center; padding-right: 10px; font-size: 16px; color: #6c7a72;">$</span>
              <input id="yg-modal-capital" type="number" min="100" step="10" value="{{ capital }}" onChange="{{ onCapital }}" placeholder="100" style="flex: 1; padding: 12px 0; font-family: inherit; font-size: 16px; color: #edf2ee; background: transparent; border: 0; border-radius: 0;">
            </div>
          </div>
          <label for="yg-modal-agree" style="display: flex; align-items: flex-start; gap: 12px; cursor: pointer; font-size: 13px; line-height: 1.55; color: #9aa5a0;">
            <input id="yg-modal-agree" type="checkbox" checked="{{ agree }}" onChange="{{ onAgree }}" style="width: 18px; height: 18px; accent-color: #c6fb3e; margin: 2px 0 0; flex: 0 0 auto;">
            <span>My account is under Yash's referral link and I accept the rules.</span>
          </label>
          <sc-if value="{{ errAgree }}" hint-placeholder-val="{{ false }}">
            <div style="font-size: 13px; color: #ff8a6b; margin-top: -16px;">{{ errAgree }}</div>
          </sc-if>
          <button type="submit" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; background: #c6fb3e; color: #0c0e0d; border: 0; padding: 18px 24px; font-family: inherit; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.16em; cursor: pointer;" style-hover="background: #d6ff6b; color: #0c0e0d;">
            <span>{{ submitLabel }}</span><span style="font-size: 18px; letter-spacing: 0;">→</span>
          </button>
        </form>
      </sc-if>
    </div>
  </main>

<script type="text/x-dc" data-dc-script data-props="{&quot;submitLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lock in my entry&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Form&quot;},&quot;formEndpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://script.google.com/macros/s/AKfycbwhRZFia2ghXEO3LunEH_0sUlYpmQSfY2hI-p4HP4gI1nIvkPofYjrQVYFZL4HKN4Gi/exec&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Form&quot;}}">
class Component extends DCLogic {
  state = { name: "", phone: "", email: "", capital: "", agree: false, errors: {}, submitted: false };

  validate() {
    const e = {};
    if (!this.state.name.trim()) e.name = "Please enter your name.";
    const digits = this.state.phone.replace(/[^0-9]/g, "");
    if (!digits) e.phone = "Please enter your WhatsApp number.";
    else if (digits.length < 8) e.phone = "That number looks too short.";
    if (!this.state.email.trim()) e.email = "Please enter your email.";
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(this.state.email.trim())) e.email = "Please enter a valid email address.";
    if (!this.state.agree) e.agree = "Please confirm your account and the rules.";
    return e;
  }

  renderVals() {
    const err = this.state.errors;
    return {
      name: this.state.name, phone: this.state.phone, email: this.state.email,
      capital: this.state.capital, agree: this.state.agree,
      errName: err.name || "", errPhone: err.phone || "", errEmail: err.email || "", errAgree: err.agree || "",
      submitted: this.state.submitted, notSubmitted: !this.state.submitted,
      firstName: (this.state.name.trim().split(/\s+/)[0] || "trader"),
      submitLabel: this.props.submitLabel ?? "Lock in my entry",
      onName: (ev) => this.setState({ name: ev.target.value }),
      onPhone: (ev) => this.setState({ phone: ev.target.value }),
      onEmail: (ev) => this.setState({ email: ev.target.value }),
      onCapital: (ev) => this.setState({ capital: ev.target.value }),
      onAgree: (ev) => this.setState({ agree: ev.target.checked }),
      reset: () => this.setState({ name: "", phone: "", email: "", capital: "", agree: false, errors: {}, submitted: false }),
      onSubmit: (ev) => {
        ev.preventDefault();
        const errors = this.validate();
        if (Object.keys(errors).length) { this.setState({ errors }); return; }
        const endpoint = this.props.formEndpoint || window.YG_FORM_ENDPOINT || "https://script.google.com/macros/s/AKfycbwhRZFia2ghXEO3LunEH_0sUlYpmQSfY2hI-p4HP4gI1nIvkPofYjrQVYFZL4HKN4Gi/exec";
        if (endpoint) {
          const body = new URLSearchParams();
          body.append("name", this.state.name);
          body.append("phone", this.state.phone);
          body.append("email", this.state.email);
          body.append("capital", this.state.capital || "N/A");
          body.append("timestamp", new Date().toLocaleString());
          try {
            fetch(endpoint, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: body
            });
          } catch (e) {
            console.error("Form submit error:", e);
          }
        } else {
          console.warn("Form submission skipped: formEndpoint is empty. Please configure your Google Apps Script Web App URL.");
        }
        this.setState({ errors: {}, submitted: true });
      }
    };
  }
}
</script>
